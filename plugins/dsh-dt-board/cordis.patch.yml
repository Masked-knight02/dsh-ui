# dsh-dt-board bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:<path>/plugins/dsh-dt-board`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the /api/dsh-dt-board/overview and
# /api/dsh-dt-board/tasks CRUD routes over ~/.dsh/dsh-dt-board.json), and the
# dsh.client declaration in package.json makes the browser half (exports
# "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-dt-board
      name: '@masked-knight02/dsh-client-ui-dt-board'
